name: macOS

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["mac/**"]

jobs:
  build:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CallBridge.app
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          APP_VERSION="${APP_VERSION#v}" ./make_app.sh release
        working-directory: mac

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/CallBridge.app CallBridge-macOS.zip
        working-directory: mac

      # Ed25519 signature over the zip; the updater refuses unsigned
      # archives. The key is the RELEASE_SIGNING_KEY secret; the matching
      # public key is compiled into the app.
      - name: Sign update archive (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: swift mac/sign_update.swift "$SIGNING_KEY" mac/CallBridge-macOS.zip > mac/CallBridge-macOS.zip.sig
        working-directory: .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: callbridge-macos
          path: mac/CallBridge-macOS.zip*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: callbridge-macos
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
