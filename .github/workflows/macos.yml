name: macOS

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["mac/**"]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CallBridge.app
        run: ./make_app.sh release
        working-directory: mac

      - name: Zip app bundle
        run: ditto -c -k --keepParent build/CallBridge.app CallBridge-macOS.zip
        working-directory: mac

      - name: Upload artifact (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: callbridge-macos
          path: mac/CallBridge-macOS.zip

      - name: Attach app to release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mac/CallBridge-macOS.zip
