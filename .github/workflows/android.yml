name: Android

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      # Release signing: the keystore lives in the RELEASE_KEYSTORE secret
      # (base64 of android/release.keystore). Without the secret, PR builds
      # fall back to the debug signature.
      - name: Decode release keystore
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > android/release.keystore
        working-directory: .

      - name: Build release APK (tags) / debug APK (PRs)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CALLBRIDGE_STORE_PASSWORD: ${{ secrets.CALLBRIDGE_STORE_PASSWORD }}
          CALLBRIDGE_KEY_PASSWORD: ${{ secrets.CALLBRIDGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
        working-directory: android

      - name: Build debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug
        working-directory: android

      - name: Upload artifact (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: callbridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/CallBridge-${{ github.ref_name }}.apk"
        working-directory: android

      - name: Attach APK to release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/CallBridge-${{ github.ref_name }}.apk
