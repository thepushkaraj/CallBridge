name: Android

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Validates the gradle wrapper checksums on every run.
      - uses: gradle/actions/setup-gradle@v4

      # Release signing: the keystore lives in the RELEASE_KEYSTORE_B64
      # secret (base64 of android/release.keystore) and the passwords in
      # CALLBRIDGE_STORE_PASSWORD / CALLBRIDGE_KEY_PASSWORD. Without them,
      # release builds fall back to the debug signature.
      - name: Decode release keystore (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: echo "$RELEASE_KEYSTORE_B64" | base64 -d > android/release.keystore

      - name: Build release APK (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CALLBRIDGE_STORE_PASSWORD: ${{ secrets.CALLBRIDGE_STORE_PASSWORD }}
          CALLBRIDGE_KEY_PASSWORD: ${{ secrets.CALLBRIDGE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
        working-directory: android

      - name: Build debug APK (pull requests)
        if: github.event_name == 'pull_request'
        run: ./gradlew :app:assembleDebug
        working-directory: android

      - name: Rename APK for release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/CallBridge-${{ github.ref_name }}.apk"
        working-directory: android

      - name: Upload release APK (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: callbridge-apk
          path: android/app/build/outputs/apk/release/CallBridge-*.apk

      - name: Upload debug APK (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: callbridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: callbridge-apk
          path: apk

      - uses: softprops/action-gh-release@v2
        with:
          files: apk/*.apk
