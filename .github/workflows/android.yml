name: Android

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["android/**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug
        working-directory: android

      - name: Upload artifact (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: callbridge-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/CallBridge-${{ github.ref_name }}.apk"
        working-directory: android

      - name: Attach APK to release (tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/CallBridge-${{ github.ref_name }}.apk
